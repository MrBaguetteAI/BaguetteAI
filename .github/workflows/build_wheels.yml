name: Build Wheels

on: [push, pull_request]

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # <-- ADD THIS: Prevents one OS failure from cancelling the others
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.16.5
        env:
          # Merge all skip rules into one string
          # Skip 32-bit, skip PyPy, and skip Python 3.8/3.9 on macOS ARM (they are very slow/unstable)
          CIBW_SKIP: "*-win32 *-manylinux_i686 pp* cp38-macosx_arm64 cp39-macosx_arm64"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl
