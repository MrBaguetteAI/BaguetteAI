[build-system]
requires = ["setuptools>=64", "pybind11>=2.13"]
build-backend = "setuptools.build_meta"

[project]
name = "BaguetteAI"
dynamic = ["version"]
description = "An AI development library written in python."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.8"
dependencies = ["numpy>=1.20"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "BaguetteAI.__version__"}

[[tool.setuptools.ext-modules]]
name = "BaguetteAI.neural.neural_functions"
sources = ["src/BaguetteAI/neural/neural_functions.cpp"]
