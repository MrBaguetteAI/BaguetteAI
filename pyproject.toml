[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "BaguetteAI"
version = "0.1.0"
description = "An AI development library written in python."
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["numpy>=1.20"]

[tool.setuptools.packages.find]
where = ["src"]
